[workspace]
resolver = "2"

members = [
    "account",
    "invoice",
    "upgrade",
    "validation-modules",
]
# cargo-fuzz targets manage their own toolchain/profile (ASan, sanitizer-coverage
# RUSTFLAGS) and must not be resolved as part of this workspace — added in #1218
# without this exclusion, which is why `cargo fuzz build` failed in CI with
# "current package believes it's in a workspace when it's not".
exclude = ["account/fuzz"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.74.0"

[workspace.dependencies]
soroban-sdk = "21.7.0"

[profile.release]
opt-level = "z"
overflow-checks = true
debug = 0
strip = "symbols"
debug-assertions = false
panic = "abort"
codegen-units = 1
lto = true

[profile.release-with-logs]
inherits = "release"
debug-assertions = true
