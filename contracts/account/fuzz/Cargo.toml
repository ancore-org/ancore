[package]
name = "ancore-account-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

# Opt this crate out of the ancestor `contracts` workspace entirely — the
# standard cargo-fuzz convention, and it takes effect unconditionally, unlike
# the parent's `workspace.exclude` (added alongside this — belt and suspenders,
# but this empty table is what actually resolves "current package believes
# it's in a workspace when it's not").
[workspace]

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
arbitrary = { version = "1", features = ["derive"] }
ancore-account = { path = "..", features = ["fuzzing"] }

[[bin]]
name = "fuzz_spend_policy"
path = "fuzz_targets/fuzz_spend_policy.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_permissions"
path = "fuzz_targets/fuzz_permissions.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_spend_limits"
path = "fuzz_targets/fuzz_spend_limits.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_execute_args"
path = "fuzz_targets/fuzz_execute_args.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_allowlist"
path = "fuzz_targets/fuzz_allowlist.rs"
test = false
doc = false
bench = false

[[bin]]
name = "fuzz_add_session_key"
path = "fuzz_targets/fuzz_add_session_key.rs"
test = false
doc = false
bench = false
