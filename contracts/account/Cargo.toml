[package]
name = "ancore-account"
version.workspace = true
edition.workspace = true
rust-version.workspace = true

[lib]
# cdylib for Soroban WASM; rlib so cargo-fuzz / property tests can link helpers.
crate-type = ["cdylib", "rlib"]
doctest = false

[dependencies]
soroban-sdk.workspace = true

[target.'cfg(not(target_family = "wasm"))'.dependencies]
ed25519-dalek = "3.0.0"

[dev-dependencies]
soroban-sdk = { workspace = true, features = ["testutils"] }
ed25519-dalek = { version = "3.0.0", features = ["rand_core"] }
rand = "0.9.5"
proptest = "1.5"

[features]
testutils = ["soroban-sdk/testutils"]
# Enables re-exports aimed at the fuzz harness (no behavior change).
fuzzing = []

# Profile settings inherited from workspace (contracts/Cargo.toml)
