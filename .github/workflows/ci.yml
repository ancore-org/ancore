name: CI

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  changes:
    name: Detect Changed Paths
    runs-on: ubuntu-latest
    outputs:
      contracts: ${{ steps.filter.outputs.contracts }}
      apps: ${{ steps.filter.outputs.apps }}
      services: ${{ steps.filter.outputs.services }}
      packages: ${{ steps.filter.outputs.packages }}
      indexer: ${{ steps.filter.outputs.indexer }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            contracts:
              - 'contracts/**'
              - 'scripts/check-wasm-size.js'
              - '.github/workflows/ci.yml'
            apps:
              - 'apps/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            services:
              - 'services/**'
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - '.github/workflows/ci.yml'
            packages:
              - 'packages/**'
              - 'package.json'
              - 'pnpm-lock.yaml'
              - 'turbo.json'
              - '.github/workflows/ci.yml'
            indexer:
              - 'services/indexer/**'
              - '.github/workflows/ci.yml'

  actionlint:
    name: Actionlint — Workflow YAML
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Download actionlint
        id: get_actionlint
        run: bash <(curl -fsSL https://raw.githubusercontent.com/rhysd/actionlint/main/scripts/download-actionlint.bash)
        shell: bash

      - name: Check workflow files
        run: ${{ steps.get_actionlint.outputs.executable }} -color
        shell: bash

  audit:
    name: Dependency Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Validate pnpm audit allowlist
        run: node scripts/check-audit-allowlist.js

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@1.81.0

      - name: Cache cargo-audit
        uses: actions/cache@v4
        with:
          path: ~/.cargo/bin/cargo-audit
          key: ${{ runner.os }}-cargo-audit-v0.21

      - name: Install cargo-audit
        run: which cargo-audit || cargo install --locked cargo-audit

      - name: Cargo audit contracts
        working-directory: ./contracts
        run: cargo audit

      - name: Cargo audit indexer
        # Cargo.lock for the indexer lives at the `services/` workspace root and is
        # gitignored, so generate it there before auditing.
        working-directory: ./services
        run: |
          cargo generate-lockfile
          cargo audit

  install-scripts:
    name: Install Script Policy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile --ignore-scripts

      - name: Validate install script allowlist
        run: node scripts/check-install-scripts.js

  format:
    name: Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Check formatting
        run: pnpm format:check

      # Separate step so a CR-only file is reported distinctly from an
      # ordinary formatting miss — Prettier cannot flag it (#1353).
      - name: Check line endings
        run: pnpm check:line-endings

  typecheck:
    name: Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'

      - run: pnpm install --frozen-lockfile

      - name: Run typecheck
        run: pnpm typecheck

  lint-translations:
    name: Extension Translation Lint
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.apps == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint extension translation keys
        run: pnpm --filter @ancore/extension-wallet lint:translations

  package:
    name: Package — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.packages == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: types
            filter: '@ancore/types'
          - name: crypto
            filter: '@ancore/crypto'
          - name: stellar
            filter: '@ancore/stellar'
          - name: core-sdk
            filter: '@ancore/core-sdk'
          - name: ui-kit
            filter: '@ancore/ui-kit'
          - name: account-abstraction
            filter: '@ancore/account-abstraction'
          - name: wallet-shared
            filter: '@ancore/wallet-shared'
          - name: wallet-api
            filter: '@ancore/wallet-api'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=${{ matrix.filter }}

      - name: Test
        run: pnpm turbo run test --filter=${{ matrix.filter }}

      - name: Coverage gate (security-critical packages)
        if: contains(fromJSON('["core-sdk", "account-abstraction", "crypto", "stellar"]'), matrix.name)
        run: node scripts/coverage-gate.js

  app:
    name: App — ${{ matrix.name }}
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.apps == 'true'
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: extension-wallet
            filter: '@ancore/extension-wallet'
          - name: web-dashboard
            filter: '@ancore/web-dashboard'
          - name: mobile-wallet
            filter: '@ancore/mobile-wallet'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint --filter=${{ matrix.filter }}

      - name: Test
        run: pnpm turbo run test --filter=${{ matrix.filter }}

  services:
    name: Services — Lint & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.services == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint services
        run: pnpm turbo run lint --filter='@ancore/relayer' --filter='@ancore/ai-agent'

      - name: Test services
        run: pnpm turbo run test --filter='@ancore/relayer' --filter='@ancore/ai-agent' --concurrency=1

      - name: Check documented repository structure
        run: pnpm docs:check-structure

      - name: Validate documentation links
        run: pnpm docs:validate-links

      - name: Lint OpenAPI specs
        run: pnpm docs:lint-openapi

  contracts:
    name: Contracts — Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.contracts == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@1.81.0

      - name: Ensure Cargo cache directories exist
        run: |
          mkdir -p "$HOME/.cargo/bin"
          mkdir -p "$HOME/.cargo/registry/index"
          mkdir -p "$HOME/.cargo/registry/cache"
          mkdir -p "$HOME/.cargo/git/db"
          mkdir -p ${{ github.workspace }}/contracts/target

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/contracts/target
          key: ${{ runner.os }}-cargo-${{ hashFiles('contracts/Cargo.lock') }}

      - run: rustup target add wasm32-unknown-unknown

      - name: Install Stellar CLI
        run: |
          mkdir -p ~/.local/bin
          curl -L https://github.com/stellar/stellar-cli/releases/download/v22.0.1/stellar-cli-22.0.1-x86_64-unknown-linux-gnu.tar.gz | tar xz -C ~/.local/bin
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          stellar version

      - name: Build contracts
        working-directory: ./contracts
        run: stellar contract build

      - name: Check Rust formatting
        working-directory: ./contracts
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ./contracts
        run: cargo clippy -- -D warnings

      - name: Test contracts
        working-directory: ./contracts
        run: cargo test

      - name: Check WASM size regression
        run: node scripts/check-wasm-size.js

  indexer-migrations:
    name: Indexer — Migration Check
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.indexer == 'true'
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ancore
          POSTGRES_PASSWORD: ancore
          POSTGRES_DB: ancore_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ancore"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4

      - name: Apply migrations (up smoke)
        env:
          DATABASE_URL: postgres://ancore:ancore@localhost:5432/ancore_test
        run: bash services/indexer/scripts/check-migrations.sh

  indexer:
    name: Indexer — Build & Test
    runs-on: ubuntu-latest
    needs: changes
    if: github.event_name == 'push' || needs.changes.outputs.indexer == 'true'
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v2
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'pnpm'
          cache-dependency-path: pnpm-lock.yaml

      - run: pnpm install --frozen-lockfile

      - name: Lint indexer migrations
        run: pnpm indexer:lint-migrations

      - uses: dtolnay/rust-toolchain@1.81.0
        with:
          components: rustfmt, clippy

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
            ${{ github.workspace }}/services/indexer/target
          key: ${{ runner.os }}-indexer-cargo-${{ hashFiles('services/indexer/Cargo.lock', 'services/Cargo.toml') }}
          restore-keys: |
            ${{ runner.os }}-indexer-cargo-

      - name: Check formatting
        working-directory: ./services/indexer
        run: cargo fmt --check

      - name: Run clippy
        working-directory: ./services/indexer
        run: cargo clippy -- -D warnings

      - name: Run tests
        working-directory: ./services/indexer
        run: cargo test

  ci-status:
    name: CI Required Checks Status
    runs-on: ubuntu-latest
    needs:
      [
        audit,
        format,
        lint-translations,
        package,
        app,
        services,
        contracts,
        indexer-migrations,
        indexer,
      ]
    if: always()
    steps:
      - name: Verify all executed jobs passed
        run: |
          results="${{ join(needs.*.result, ' ') }}"
          echo "Job results: $results"
          if echo "$results" | grep -qE "failure|cancelled"; then
            echo "Error: One or more CI jobs failed or were cancelled."
            exit 1
          fi
          echo "All CI jobs passed or were skipped."
