name: Mobile App E2E Tests

on:
  schedule:
    - cron: '0 0 * * *'
  workflow_dispatch:

concurrency:
  group: e2e-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  checks: write
  pull-requests: write

env:
  MOBILE_APP_DIR: apps/mobile-app

jobs:
  test-ios:
    name: iOS E2E Tests
    runs-on: macos-14
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flow:
          - create-wallet.yaml
          - import-wallet.yaml
          - lock-unlock.yaml

    steps:
      - uses: actions/checkout@v7

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '15.4'

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Setup Maestro
        run: |
          brew tap mobile-dev-inc/maestro
          brew install maestro
          maestro --version

      - name: Build iOS app
        run: |
          chmod +x apps/mobile-app/scripts/*.sh
          ./apps/mobile-app/scripts/build-ios-dev.sh

      - name: Boot iOS Simulator
        run: |
          xcrun simctl boot "iPhone 15" || true
          xcrun simctl bootstatus "iPhone 15" -b

      - name: Install iOS app
        run: xcrun simctl install booted "${{ env.APP_PATH }}"

      - name: Run Maestro flow - ${{ matrix.flow }}
        working-directory: ${{ env.MOBILE_APP_DIR }}
        run: |
          maestro test \
            "e2e/flows/${{ matrix.flow }}" \
            --env-file e2e/common/env.yaml \
            --timeout 600

      - name: Capture iOS screenshots on failure
        if: failure()
        run: |
          mkdir -p apps/mobile-app/e2e-artifacts/ios
          xcrun simctl io booted screenshot "apps/mobile-app/e2e-artifacts/ios/screenshot-${{ matrix.flow }}.png" || true

      - name: Upload iOS artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-ios-${{ matrix.flow }}
          path: apps/mobile-app/e2e-artifacts/ios
          retention-days: 7

  test-android:
    name: Android E2E Tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        flow:
          - create-wallet.yaml
          - import-wallet.yaml
          - lock-unlock.yaml

    steps:
      - uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 9

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '20'
          cache: pnpm

      - name: Setup Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install dependencies
        run: corepack pnpm install --frozen-lockfile

      - name: Setup Maestro
        run: |
          curl -Ls "https://get.maestro.mobile.dev" | bash
          echo "$HOME/.maestro/bin" >> "$GITHUB_PATH"
          maestro --version

      - name: Build Android app
        run: |
          chmod +x apps/mobile-app/scripts/*.sh
          ./apps/mobile-app/scripts/build-android-dev.sh

      - name: Start Android Emulator and run Maestro
        uses: reactivecircuits/android-emulator-runner@v2
        with:
          api-level: 33
          target: google_apis
          arch: x86_64
          force-avd-creation: false
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: |
            adb wait-for-device
            adb shell input keyevent 82
            adb install -r apps/mobile-app/android/app/build/outputs/apk/dev/debug/app-dev-debug.apk
            cd apps/mobile-app
            maestro test \
              "e2e/flows/${{ matrix.flow }}" \
              --env-file e2e/common/env.yaml \
              --timeout 600

      - name: Upload Android artifacts
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: e2e-artifacts-android-${{ matrix.flow }}
          path: apps/mobile-app/e2e-artifacts/android
          retention-days: 7

  results:
    name: E2E Test Results
    runs-on: ubuntu-latest
    if: always()
    needs: [test-ios, test-android]
    steps:
      - name: Check test status
        run: |
          echo "### E2E Test Results" >> "$GITHUB_STEP_SUMMARY"
          if [ "${{ needs.test-ios.result }}" = "success" ] && [ "${{ needs.test-android.result }}" = "success" ]; then
            echo "✅ All E2E tests passed" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          else
            {
              echo "❌ Some E2E tests failed"
              echo "- iOS: ${{ needs.test-ios.result }}"
              echo "- Android: ${{ needs.test-android.result }}"
            } >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
