apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    root = file("..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
    debuggableVariants = ["devDebug", "prodDebug"]
}

def enableProguardInReleaseBuilds = false

def getEnv(String key, String fallback = "") {
    return System.getenv(key) ?: fallback
}

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.ancore.wallet"

    flavorDimensions "environment"

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }

        dev {
            def keystorePath = file("../keystores/dev-release.keystore")
            if (keystorePath.exists()) {
                storeFile keystorePath
                storePassword getEnv("ANDROID_DEV_KEYSTORE_PASSWORD")
                keyAlias getEnv("ANDROID_DEV_KEYSTORE_ALIAS", "ancore-dev")
                keyPassword getEnv("ANDROID_DEV_KEYSTORE_PASSWORD")
            }
        }

        prod {
            def keystorePath = file("../keystores/prod-release.keystore")
            if (keystorePath.exists()) {
                storeFile keystorePath
                storePassword getEnv("ANDROID_PROD_KEYSTORE_PASSWORD")
                keyAlias getEnv("ANDROID_PROD_KEYSTORE_ALIAS", "ancore-prod")
                keyPassword getEnv("ANDROID_PROD_KEYSTORE_PASSWORD")
            }
        }
    }

    productFlavors {
        dev {
            dimension "environment"
            applicationId "org.ancore.wallet.dev"
            resValue "string", "app_name", "Ancore Wallet Dev"
            manifestPlaceholders = [deepLinkScheme: "ancoredev"]
        }

        prod {
            dimension "environment"
            applicationId "org.ancore.wallet"
            resValue "string", "app_name", "Ancore Wallet"
            manifestPlaceholders = [deepLinkScheme: "ancore"]
        }
    }

    defaultConfig {
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 1
        versionName "0.1.0"
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
        }

        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
        }
    }

    applicationVariants.all { variant ->
        def flavorName = variant.flavorName
        if (variant.buildType.name == "release") {
            if (flavorName == "dev" && signingConfigs.dev.storeFile != null) {
                variant.signingConfig = signingConfigs.dev
            } else if (flavorName == "prod" && signingConfigs.prod.storeFile != null) {
                variant.signingConfig = signingConfigs.prod
            }
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
