apply plugin: "com.android.application"
apply plugin: "org.jetbrains.kotlin.android"
apply plugin: "com.facebook.react"

react {
    // Monorepo support: the app JS is in the root of this package
    root = file("..")
    reactNativeDir = file("../../../node_modules/react-native")
    codegenDir = file("../../../node_modules/@react-native/codegen")
}

def enableProguardInReleaseBuilds = false

android {
    ndkVersion rootProject.ext.ndkVersion
    buildToolsVersion rootProject.ext.buildToolsVersion
    compileSdk rootProject.ext.compileSdkVersion

    namespace "org.ancore"

    defaultConfig {
        applicationId "org.ancore.wallet"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode 100
        versionName "0.1.0"
    }

    signingConfigs {
        debug {
            storeFile file("debug.keystore")
            storePassword "android"
            keyAlias "androiddebugkey"
            keyPassword "android"
        }
        // Release signing is sourced from the environment (CI secrets) —
        // ANCORE_RELEASE_STORE_FILE points at a keystore written from a
        // secret at runtime (see .github/workflows/mobile-release.yml and
        // fastlane/Fastfile's android beta lane). Never committed.
        // Falls back to the debug keystore when unset so `assembleRelease`/
        // `bundleRelease` still work for local testing without real signing
        // material — CI always sets these, so a real release build is
        // never silently debug-signed there.
        if (System.getenv("ANCORE_RELEASE_STORE_FILE")) {
            release {
                storeFile file(System.getenv("ANCORE_RELEASE_STORE_FILE"))
                storePassword System.getenv("ANCORE_RELEASE_STORE_PASSWORD")
                keyAlias System.getenv("ANCORE_RELEASE_KEY_ALIAS")
                keyPassword System.getenv("ANCORE_RELEASE_KEY_PASSWORD")
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".dev"
            signingConfig signingConfigs.debug
        }
        release {
            minifyEnabled enableProguardInReleaseBuilds
            proguardFiles getDefaultProguardFile("proguard-android-optimize.txt"), "proguard-rules.pro"
            signingConfig System.getenv("ANCORE_RELEASE_STORE_FILE") ? signingConfigs.release : signingConfigs.debug
        }
    }
}

dependencies {
    implementation("com.facebook.react:react-android")
    implementation("com.facebook.react:hermes-android")
}

apply from: file("../../../node_modules/@react-native-community/cli-platform-android/native_modules.gradle")
applyNativeModulesAppBuildGradle(project)
