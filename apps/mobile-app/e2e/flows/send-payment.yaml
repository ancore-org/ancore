appId: org.ancore.wallet.dev
---
# Centralized from apps/mobile-wallet/e2e/flows/send-payment.yaml
# Blocked: mobile Send UI not implemented yet
- launchApp
- tapOn: "Unlock Wallet"
- tapOn: "Use Password Instead"
- tapOn: "Password"
- inputText: ${E2E_TEST_PASSWORD}
- tapOn: "Continue"
- assertVisible: "Send"
- tapOn: "Send"
- tapOn: "Recipient"
- inputText: ${E2E_RECIPIENT_ADDRESS}
- tapOn: "Continue"
- assertVisible: "Transaction Submitted"
- assertVisible: "Transaction hash"
